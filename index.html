<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Förderverein Evangelische Kirche Eichlinghofen St. Margaretha e.V.</title>
  <style>
	:root{
	  --g1:#375E57; --g2:#375E57; --g3:#058743	;
	}
	*{margin:0; padding:0; box-sizing:border-box;}
	body{
	  font-family: Verdana;
	  font-size: 19px;
	  background: linear-gradient(135deg, #a8e6cf 0%, #dcedc1 50%, #ffd3b6 100%);
	  min-height:100vh;
	}

	/* ЕДИНЫЙ градиент для шапки и подложки SVG */
	.hero{
	  background: linear-gradient(to right, var(--g1) 0%, var(--g2) 50%, var(--g3) 100%);
	  padding: 20px 50px 0;
	}

	nav{ /* фон прозрачный — градиент даёт .hero */
	  background: transparent;
	  position: relative;
	  z-index: 1;
	}

	.nav-container{
	  max-width: 1200px;
	  margin: 0 auto;
	  display: flex;
	  justify-content: center;
	  align-items: center;
	  padding: 0 16px 20px; /* немного внутреннего отступа для узких экранов */
	}

	/* Перенос пунктов меню на новые строки при нехватке ширины */
	.nav-links{
	  display: flex;
	  flex-wrap: wrap;			/* позволяет переноситься по строкам */
	  justify-content: center;	/* центрирует каждую строку */
	  gap: 12px 40px;			/* сначала вертикальный, затем горизонтальный отступ */
	  list-style: none;
	}
	.nav-links a{
	  color:#fff;
	  text-decoration:none;
	  font-size:16px;
	  font-weight:500;
	  transition:opacity .3s;
	  text-shadow:1px 1px 2px rgba(0,0,0,.3);
	  white-space: nowrap;		/* сам текст ссылки не ломается внутри */
	}
	.nav-links a:hover{opacity:.8;}

	.church-outline{display:block; width:100%; height:120px;}

	.content{max-width:1200px; margin:50px auto; padding:0 50px;}
	h1{color:#333; margin-bottom:20px;}
	p{color:#000000; line-height:1.6;}

	/* Небольшая адаптация на очень маленьких экранах */
	@media (max-width: 640px){
	  .nav-links{ gap: 8px 24px; }
	  .nav-links a{ font-size: 15px; }
	  .content{ padding: 0 20px; }
	}
  </style>
</head>
<body>
  <header class="hero">
	<nav>
	  <div class="nav-container">
		<ul class="nav-links">
		  <li><a href="#home">Startseite</a></li>
		  <li><a href="#about">Über uns</a></li>
		  <li><a href="#events">Veranstaltungen</a></li>
		  <li><a href="#donations">Spenden</a></li>
		  <li><a href="./Impressum.html">Impressum</a></li>
		  <li><a href="./DSE.html">Datenschutzerklärung</a></li>
		</ul>
	  </div>
	</nav>
  </header>

  <div class="content">
	<h1>Willkommen bei unserem Treff am Turm!</h1>
	<p>Hier entsteht die Web-Präsenz vom Förderverein Evangelische Kirche Eichlinghofen St. Margaretha e.V.</p>
  </div>
</body>
</html>
