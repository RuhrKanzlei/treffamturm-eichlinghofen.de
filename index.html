<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Förderverein Evangelische Kirche Eichlinghofen St. Margareta e.V.</title>
  <style>
	:root{
	  --g1:#375E57; --g2:#375E57; --g3:#058743;
	  --size: clamp(320px, 60vmin, 680px);
	  --radius: clamp(90px, 26vmin, 260px);
	  --speed: 55s;
	  --count: 8;
	}
	
	*{margin:0; padding:0; box-sizing:border-box;}
	body{
	  font-family: Verdana;
	  font-size: 19px;
	  background: linear-gradient(135deg, #a8e6cf 0%, #dcedc1 50%, #ffd3b6 100%);
	  min-height:100vh;
	}

	.site-logo{
	float:left;
	display:block;
	margin: 25px 25px 15px 25px;
	height:auto;
	width:auto;
	}

	.hero{
	  background: linear-gradient(to right, var(--g1) 0%, var(--g2) 50%, var(--g3) 100%);
	  padding: 20px 50px 0;
	}

	nav{
	  background: transparent;
	  position: relative;
	  z-index: 1;
	}

	.nav-container{
	  max-width: 1200px;
	  margin: 0 auto;
	  display: flex;
	  justify-content: center;
	  align-items: center;
	  padding: 0 16px 20px;
	}

	.nav-links{
	  display: flex;
	  flex-wrap: wrap;
	  justify-content: center;
	  gap: 12px 40px;
	  list-style: none;
	}
	.nav-links a{
	  color:#fff;
	  text-decoration:none;
	  font-size:16px;
	  font-weight:500;
	  transition:opacity .3s;
	  text-shadow:1px 1px 2px rgba(0,0,0,.3);
	  white-space: nowrap;
	}
	.nav-links a:hover{opacity:.8;}

	.church-outline{display:block; width:100%; height:120px;}

	.content{max-width:1200px; margin:50px auto; padding:0 50px;}
	h1{color:#333; margin-bottom:20px;}
	p{color:#000000; line-height:1.6;}

	@media (max-width: 640px){
	  .nav-links{ gap: 8px 24px; }
	  .nav-links a{ font-size: 15px; }
	  .content{ padding: 0 20px; }
	}
	
	.collage-wrap {
	  width: 100%;
	  height: clamp(640px, 12vmin, 640px);
	  overflow: hidden;
	  margin: 60px auto;
	  position: relative;
	}

	.wheel {
	  display: flex;
	  align-items: center;
	  height: 100%;
	  width: max-content;
	  animation: moveLeft linear infinite var(--speed);
	}

	@keyframes moveLeft {
	  from {
		transform: translateX(0);
	  }
	  to {
		transform: translateX(-50%);
	  }
	}

	.photo {
	  flex: 0 0 clamp(480px, 12vmin, 640px);
	  height: clamp(480px, 12vmin, 640px);
	  border-radius: 12px;
	  overflow: hidden;
	  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
	  background: #eee;
	  margin: 0 8px;
	  display: grid;
	  place-items: center;
	}

	.photo img {
	  width: 100%;
	  height: 100%;
	  object-fit: cover;
	  display: block;
	}

	.caption {
	  text-align: center;
	  font-size: 13px;
	  color: #222;
	  opacity: 0.8;
	  margin-top: 6px;
	}

  </style>
</head>
